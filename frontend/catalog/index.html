<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title id="page-title">Menú</title>
<script src="/env.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<script>
  tailwind.config = { theme: { extend: {
    colors: { primary: '#FF6B35', secondary: '#2EC4B6', success: '#2ECC71' },
    fontFamily: { headline: ['Plus Jakarta Sans','sans-serif'], body: ['Inter','sans-serif'], label: ['Space Grotesk','sans-serif'] }
  } } };
</script>
<style>
  html, body { overscroll-behavior: none; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; display: inline-block; line-height: 1; }
  .hide-scrollbar::-webkit-scrollbar { display: none; }
  .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>
<body class="bg-[#F7F8FA] font-body text-neutral-900 min-h-screen pb-28">

<!-- Header -->
<header class="fixed top-0 w-full z-30 bg-white border-b border-neutral-100 shadow-sm max-w-lg left-1/2 -translate-x-1/2">
  <div class="flex flex-col w-full px-4 pt-4 pb-2">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3 min-w-0">
        <img id="tenant-logo" src="" alt="" class="w-10 h-10 rounded-lg object-cover bg-primary/10 hidden">
        <div id="tenant-icon" class="bg-primary/10 p-2 rounded-lg text-primary shrink-0">
          <span class="material-symbols-outlined">restaurant</span>
        </div>
        <div class="min-w-0">
          <h1 id="tenant-name" class="font-headline text-lg font-bold leading-tight truncate">Cargando...</h1>
          <p id="tenant-status" class="text-[10px] font-bold flex items-center gap-1"></p>
        </div>
      </div>
      <button id="btn-open-cart" class="relative p-2 text-primary active:scale-95 transition-transform shrink-0">
        <span class="material-symbols-outlined text-2xl">shopping_cart</span>
        <span id="header-cart-count" class="hidden absolute top-1 right-1 bg-red-500 text-white text-[10px] font-bold w-4 h-4 flex items-center justify-center rounded-full">0</span>
      </button>
    </div>
    <p id="tenant-description" class="text-xs text-slate-500 mt-1"></p>
    <!-- Buscador -->
    <div class="mt-3 relative group">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-neutral-400 group-focus-within:text-primary transition-colors">search</span>
      <input id="product-search" type="search" placeholder="¿Qué se te antoja hoy?"
        class="w-full bg-neutral-100 border-none rounded-xl py-3 pl-10 pr-4 text-sm focus:ring-2 focus:ring-secondary outline-none placeholder:text-neutral-500">
    </div>
    <!-- Categorías -->
    <div id="category-tabs" class="flex gap-2 overflow-x-auto hide-scrollbar py-2 -mx-4 px-4"></div>
  </div>
</header>

<!-- spacer para header fijo -->
<div id="header-spacer" class="max-w-lg mx-auto" style="height: 190px"></div>

<!-- Lista de productos -->
<main id="product-list" class="max-w-lg mx-auto px-4 pb-4 space-y-6"></main>

<!-- Floating footer: resumen de carrito -->
<div id="fab-order-wrap" class="fixed bottom-0 w-full z-40 max-w-lg left-1/2 -translate-x-1/2 p-4 pb-6 bg-gradient-to-t from-[#F7F8FA] to-transparent">
  <button id="fab-order" class="w-full bg-neutral-900 text-white rounded-2xl p-4 flex items-center justify-between shadow-2xl ring-1 ring-white/10 disabled:opacity-50 disabled:pointer-events-none">
    <div class="flex flex-col items-start">
      <span class="text-xs text-neutral-400 font-label uppercase tracking-tighter">Tu orden</span>
      <p class="font-headline font-bold text-lg leading-none"><span id="fab-count">0</span> items - <span id="fab-total" class="text-primary">$0.00</span></p>
    </div>
    <span class="bg-primary text-white px-5 py-2.5 rounded-xl font-bold flex items-center gap-2 text-sm">
      <span id="fab-label">Ver Carrito</span>
      <span class="material-symbols-outlined text-sm">arrow_forward</span>
    </span>
  </button>
</div>

<!-- Modal modificadores: quitar ingredientes base / agregar extras con costo -->
<div id="modal-modifiers" class="fixed inset-0 z-50 hidden items-end justify-center bg-black/40">
  <div class="w-full max-w-lg bg-white rounded-t-3xl max-h-[85vh] flex flex-col">
    <div class="p-4 border-b border-slate-200 flex justify-between items-center shrink-0">
      <h2 id="modifiers-product-name" class="font-bold text-lg truncate"></h2>
      <button id="btn-modifiers-close" class="text-slate-400 text-2xl leading-none">×</button>
    </div>
    <div class="flex-1 overflow-y-auto p-4 space-y-4">
      <div id="modifiers-remove-section" class="hidden">
        <h3 class="text-sm font-semibold text-slate-500 mb-2">Quitar ingredientes</h3>
        <div id="modifiers-remove-list" class="space-y-2"></div>
      </div>
      <div id="modifiers-extra-section" class="hidden">
        <h3 class="text-sm font-semibold text-slate-500 mb-2">Agregar extras</h3>
        <div id="modifiers-extra-list" class="space-y-2"></div>
      </div>
    </div>
    <div class="p-4 border-t border-slate-200 shrink-0">
      <button id="btn-modifiers-add" class="w-full h-14 rounded-xl bg-primary text-white font-bold flex items-center justify-center gap-2">
        Agregar — <span id="modifiers-total-price">$0.00</span>
      </button>
    </div>
  </div>
</div>

<!-- Modal carrito -->
<div id="modal-cart" class="fixed inset-0 z-50 hidden items-end justify-center bg-black/40">
  <div class="w-full max-w-lg bg-white rounded-t-3xl max-h-[85vh] flex flex-col">
    <div class="p-4 border-b border-slate-200 flex justify-between items-center shrink-0">
      <h2 class="font-bold text-lg">Tu pedido</h2>
      <button id="btn-close-cart" class="text-slate-400 text-2xl leading-none">×</button>
    </div>
    <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
    <div class="p-4 border-t border-slate-200 shrink-0 space-y-3">
      <div class="flex justify-between font-bold text-lg">
        <span>Total</span><span id="cart-total">$0.00</span>
      </div>
      <div>
        <p class="text-sm font-semibold text-slate-500 mb-2">Método de pago</p>
        <div class="grid grid-cols-2 gap-2">
          <button data-method="CASH" class="payment-btn h-12 rounded-xl bg-slate-100 font-semibold">Efectivo</button>
          <button data-method="TRANSFER" class="payment-btn h-12 rounded-xl bg-slate-100 font-semibold">Transferencia</button>
        </div>
      </div>
      <div id="cash-change-wrap" class="hidden">
        <p class="text-sm font-semibold text-slate-500 mb-1">¿Con cuánto pagas? (para tu cambio)</p>
        <input id="cash-received" type="number" step="0.01" min="0" placeholder="$"
          class="w-full h-12 px-4 rounded-xl border border-slate-300 focus:border-primary focus:outline-none">
      </div>
      <button id="btn-send-whatsapp" disabled
        class="w-full h-14 rounded-xl bg-emerald-500 text-white font-bold disabled:opacity-40">
        Enviar pedido por WhatsApp
      </button>
    </div>
  </div>
</div>

<div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-4 py-2 rounded-lg text-sm hidden z-50"></div>

<script type="module" src="./js/catalog.js"></script>
</body>
</html>
