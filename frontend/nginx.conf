# Sirve los 3 módulos (pos/catalog/kds) desde subdominios distintos en el
# MISMO contenedor. En Dokploy: crea UN solo "app" de este Dockerfile y
# agrégale los 3 dominios (pos., catalog., kds.) — Dokploy los apunta todos
# a este contenedor, y nginx elige la carpeta correcta según el Host.
#
# Reemplaza TUDOMINIO.com por tu dominio real en los 3 server_name.

server {
  listen 80;
  server_name pos.TUDOMINIO.com;
  root /usr/share/nginx/html/pos;
  index index.html;
  location = /env.js { root /usr/share/nginx/html; }
  location / { try_files $uri $uri/ /index.html; }
}

server {
  listen 80;
  server_name catalog.TUDOMINIO.com;
  root /usr/share/nginx/html/catalog;
  index index.html;
  location = /env.js { root /usr/share/nginx/html; }
  location / { try_files $uri $uri/ /index.html; }
}

server {
  listen 80;
  server_name kds.TUDOMINIO.com;
  root /usr/share/nginx/html/kds;
  index index.html;
  location = /env.js { root /usr/share/nginx/html; }
  location / { try_files $uri $uri/ /index.html; }
}
